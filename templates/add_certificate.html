```html
{% extends "base.html" %}

{% block title %}
Add Certificate
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="glass-card">

                <!-- Header -->
                <div class="text-center mb-4">

                    <i class="fa-solid fa-trophy fa-3x"
                       style="color: #ffd700;"></i>

                    <h2 class="mt-3">
                        Add Certificate / Achievement
                    </h2>

                    <p class="text-white">
                        Add your professional certificates and achievements.
                    </p>

                </div>


                <!-- Certificate Form -->
                <form method="POST">

                    <!-- Title -->
                    <div class="mb-3">

                        <label class="form-label text-white">

                            <i class="fa-solid fa-certificate"></i>

                            Certificate Title *

                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="Example: Python Programming Certificate"
                            required
                        >

                    </div>


                    <!-- Organization -->
                    <div class="mb-3">

                        <label class="form-label text-white">

                            <i class="fa-solid fa-building"></i>

                            Organization

                        </label>

                        <input
                            type="text"
                            name="organization"
                            class="form-control"
                            placeholder="Example: Coursera, Udemy, Google"
                        >

                    </div>


                    <!-- Issue Date -->
                    <div class="mb-3">

                        <label class="form-label text-white">

                            <i class="fa-solid fa-calendar"></i>

                            Issue Date

                        </label>

                        <input
                            type="date"
                            name="issue_date"
                            class="form-control"
                        >

                    </div>


                    <!-- Certificate URL -->
                    <div class="mb-3">

                        <label class="form-label text-white">

                            <i class="fa-solid fa-link"></i>

                            Certificate URL

                        </label>

                        <input
                            type="url"
                            name="certificate_url"
                            class="form-control"
                            placeholder="https://example.com/certificate"
                        >

                    </div>


                    <!-- Description -->
                    <div class="mb-4">

                        <label class="form-label text-white">

                            <i class="fa-solid fa-align-left"></i>

                            Description

                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="5"
                            placeholder="Describe your certificate or achievement"
                        ></textarea>

                    </div>


                    <!-- Buttons -->
                    <div class="text-center">

                        <button
                            type="submit"
                            class="btn btn-warning me-2"
                        >

                            <i class="fa-solid fa-save"></i>

                            Save Certificate

                        </button>


                        <a
                            href="{{ url_for('certificates') }}"
                            class="btn btn-secondary"
                        >

                            <i class="fa-solid fa-arrow-left"></i>

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
```
